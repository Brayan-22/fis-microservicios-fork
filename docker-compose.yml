version: '3.8'

networks:
  fis-network:
    driver: bridge

# -------------------------------------
# Defaults para TODOS los microservicios
# -------------------------------------
x-service-defaults: &service-defaults
  networks:
    - fis-network
  env_file:
    - .env
  restart: always

# -------------------------------------
# Healthcheck base que usa SERVER_PORT
# -------------------------------------
x-healthcheck: &healthcheck
  test: [ "CMD", "wget", "-qO-", "http://localhost:${SERVER_PORT}/actuator/health" ]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

# -------------------------------------
# Macro GLOBAL para microservicios Spring Boot
# -------------------------------------
x-microservice: &microservice
  <<: *service-defaults
  healthcheck:
    <<: *healthcheck

services:

  # ---------------------
  # MICROSERVICIOS
  # ---------------------

  auth:
    <<: *microservice
    build: ./auth
    # Removido container_name para permitir múltiples instancias
    environment:
      SERVER_PORT: 8080
    deploy:
      replicas: 3

  catalogo:
    <<: *microservice
    build: ./catalogo
    environment:
      SERVER_PORT: 8081
    deploy:
      replicas: 2

  contenido:
    <<: *microservice
    build: ./contenido
    environment:
      SERVER_PORT: 8082
    deploy:
      replicas: 3

  email:
    <<: *microservice
    build: ./email
    environment:
      SERVER_PORT: 8083
    deploy:
      replicas: 2

  foro:
    <<: *microservice
    build: ./foro
    environment:
      SERVER_PORT: 8085
    deploy:
      replicas: 3

  geo:
    <<: *microservice
    build: ./geo
    environment:
      SERVER_PORT: 8086
    deploy:
      replicas: 2

  multimedia:
    <<: *microservice
    build: ./multimedia
    environment:
      SERVER_PORT: 8089
    deploy:
      replicas: 3

  usuario:
    <<: *microservice
    build: ./usuario
    environment:
      SERVER_PORT: 8093
    deploy:
      replicas: 3

  vehiculo:
    <<: *microservice
    build: ./vehiculo
    environment:
      SERVER_PORT: 8094
    deploy:
      replicas: 3

  # ---------------------
  #     NGINX
  # ---------------------
  nginx:
    image: nginx:alpine
    container_name: fis-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - fis-network
    depends_on:
      - auth
      - catalogo
      - contenido
      - email
      - foro
      - geo
      - multimedia
      - usuario
      - vehiculo

  # ------------
  # Apartado de contenido (ClamAV)
  #------------

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    volumes:
      - ./clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - clamav-data:/var/lib/clamav
    expose:
      - "3310"
    restart: always
    networks:
      - fis-network

  # ---------------------
  # Observabilidad
  # ---------------------

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: fis-nginx-exporter
    command:
      - -nginx.scrape-uri
      - http://nginx:80/stub_status
    networks:
      - fis-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fis-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - fis-network

  loki:
    image: grafana/loki:latest
    container_name: fis-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fis-network

  promtail:
    image: grafana/promtail:latest
    container_name: fis-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - fis-network

  grafana:
    image: grafana/grafana:latest
    container_name: fis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - fis-network

volumes:
  clamav-data:
