networks:
  fis-network:
    driver: bridge

# -------------------------------------
# Defaults para TODOS los microservicios
# -------------------------------------
x-service-defaults: &service-defaults
  networks:
    - fis-network
  env_file:
    - .env
  restart: always

# -------------------------------------
# Healthcheck template (each service overrides the port)
# -------------------------------------
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

# -------------------------------------
# Resource limits templates
# -------------------------------------
x-microservice-resources: &microservice-resources
  resources:
    limits:
      cpus: '1'
      memory: 512M
    reservations:
      cpus: '1'
      memory: 256M

x-clamav-resources: &clamav-resources
  resources:
    limits:
      cpus: '1'
      memory: 1G
    reservations:
      cpus: '0.5'
      memory: 512M

# -------------------------------------
# Macro GLOBAL para microservicios Spring Boot
# -------------------------------------
x-microservice: &microservice
  <<: *service-defaults

services:

  # ---------------------
  # MICROSERVICIOS
  # ---------------------

  auth:
    <<: *microservice
    build: ./auth
    image: brayan22/fis-project:auth
    # Removido container_name para permitir múltiples instancias
    environment:
      SERVER_PORT: 8080
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  catalogo:
    <<: *microservice
    build: ./catalogo
    image: brayan22/fis-project:catalogo
    environment:
      SERVER_PORT: 8081
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  contenido:
    <<: *microservice
    build: ./contenido
    image: brayan22/fis-project:contenido
    environment:
      SERVER_PORT: 8082
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8082/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  email:
    <<: *microservice
    build: ./email
    image: brayan22/fis-project:email
    environment:
      SERVER_PORT: 8083
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8083/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  foro:
    <<: *microservice
    build: ./foro
    image: brayan22/fis-project:foro
    environment:
      SERVER_PORT: 8085
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8085/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  geo:
    <<: *microservice
    build: ./geo
    image: brayan22/fis-project:geo
    environment:
      SERVER_PORT: 8086
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8086/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  multimedia:
    <<: *microservice
    build: ./multimedia
    image: brayan22/fis-project:multimedia
    environment:
      SERVER_PORT: 8089
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8089/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  usuario:
    <<: *microservice
    build: ./usuario
    image: brayan22/fis-project:usuario
    environment:
      SERVER_PORT: 8093
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8093/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  vehiculo:
    <<: *microservice
    build: ./vehiculo
    image: brayan22/fis-project:vehiculo
    environment:
      SERVER_PORT: 8094
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "-qO-", "http://localhost:8094/actuator/health" ]
    deploy:
      replicas: 1
      <<: *microservice-resources

  # ---------------------
  #     NGINX
  # ---------------------
  nginx:
    image: nginx:alpine
    container_name: fis-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - fis-network
    depends_on:
      - auth
      - catalogo
      - contenido
      - email
      - foro
      - geo
      - multimedia
      - usuario
      - vehiculo
    deploy:
      <<: *nginx-resources

  # ------------
  # Apartado de contenido (ClamAV)
  #------------

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    volumes:
      - ./clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - clamav-data:/var/lib/clamav
    expose:
      - "3310"
    restart: always
    networks:
      - fis-network
    deploy:
      <<: *clamav-resources

volumes:
  clamav-data:
