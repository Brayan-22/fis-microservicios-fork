  usuario:
    <<: *microservice
    image: brayan22/fis-project:usuario
    environment:
      SERVER_PORT: 8093
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      HTTP_BASIC_USER: ${HTTP_BASIC_USER}
      HTTP_BASIC_PASSWORD: ${HTTP_BASIC_PASSWORD}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources: *microservice-resources
  vehiculo:
    <<: *microservice
    image: brayan22/fis-project:vehiculo
    environment:
      SERVER_PORT: 8094
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      HTTP_BASIC_USER: ${HTTP_BASIC_USER}
      HTTP_BASIC_PASSWORD: ${HTTP_BASIC_PASSWORD}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources: *microservice-resources
  nginx:
    image: nginx:latest
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    <<: *service-defaults
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=reverse_proxy"
        - "traefik.http.routers.fis-project.entrypoints=websecure"
        - "traefik.http.routers.fis-project.tls.certresolver=production"
        - "traefik.http.routers.fis-project.tls=true"
        - "traefik.http.routers.fis-project.rule=Host(`rolapetapp.glud.org`)"
        - "traefik.http.routers.fis-project.service=fis-project"
        - "traefik.http.services.fis-project.loadbalancer.server.port=80"
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - reverse_proxy
      - fis-network