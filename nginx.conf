events {
    worker_connections 1024;
}

http {
    # Resolver DNS de Docker - CRÍTICO para resolución dinámica
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        default_type application/json;

        # Configuración para archivos estáticos
        location /uploads/ {
            alias /uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
        }

        location /auth/ {
            set $upstream_auth auth:8080;
            
            # 1. Eliminamos el prefijo /auth/ manualmente
            rewrite ^/auth/(.*) /$1 break; 
            
            # 2. Quitamos la barra al final y usamos la variable
            proxy_pass http://$upstream_auth;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ... resto de timeouts ...
        }

        # Proxy para CATALOGO
        location /catalogo/ {
            set $upstream_catalogo catalogo:8081;
            rewrite ^/catalogo/(.*) /$1 break;
            proxy_pass http://$upstream_catalogo;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para USUARIO
        location /usuario/ {
            set $upstream_usuario usuario:8093;
            rewrite ^/usuario/(.*) /$1 break;
            proxy_pass http://$upstream_usuario;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para EMAIL
        location /email/ {
            set $upstream_email email:8083;
            rewrite ^/email/(.*) /$1 break;
            proxy_pass http://$upstream_email;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para VEHICULO
        location /vehiculo/ {
            set $upstream_vehiculo vehiculo:8094;
            rewrite ^/vehiculo/(.*) /$1 break;
            proxy_pass http://$upstream_vehiculo;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para MULTIMEDIA
        location /multimedia/ {
            set $upstream_multimedia multimedia:8089;
            rewrite ^/multimedia/(.*) /$1 break;
            proxy_pass http://$upstream_multimedia;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para GEO
        location /geo/ {
            set $upstream_geo geo:8086;
            rewrite ^/geo/(.*) /$1 break;
            proxy_pass http://$upstream_geo;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para CONTENIDO
        location /contenido/ {
            set $upstream_contenido contenido:8082;
            rewrite ^/contenido/(.*) /$1 break;
            proxy_pass http://$upstream_contenido;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para FORO
        location /foro/ {
            set $upstream_foro foro:8085;
            rewrite ^/foro/(.*) /$1 break;
            proxy_pass http://$upstream_foro;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx metrics
        location /stub_status {
            stub_status;
            allow all; 
        }

        # Default location
        location / {
            return 404 "Not Found\n";
            add_header Content-Type text/plain;
        }
    }
}