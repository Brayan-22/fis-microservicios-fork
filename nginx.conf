worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ------------------------------------------------------------
    # Resolver DNS de Docker
    # Necesario para que Nginx encuentre las nuevas IPs al escalar
    # ------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ------------------------------------------------------------
    # MIME Types y configuración básica
    # ------------------------------------------------------------
    default_type application/octet-stream;
    charset utf-8;

    # ------------------------------------------------------------
    # Performance Optimizations
    # ------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 100M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Proxy buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-component text/x-cross-domain-policy;
    gzip_disable "msie6";
    gzip_min_length 256;

    # ------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ------------------------------------------------------------
    # CORS Headers (permitir todos los orígenes)
    # ------------------------------------------------------------
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Max-Age 3600 always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Security Headers básicos
    add_header X-Content-Type-Options "nosniff" always;

    server {
        listen 80;
        server_name rolapetapp.glud.org;
        default_type application/json;

        # Ocultar versión de Nginx
        server_tokens off;

        # Manejar peticiones OPTIONS para CORS preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Configuración para archivos estáticos
        location /uploads/ {
            alias /uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
        }

        # ---------------------------------------------------------
        # PROXIES A MICROSERVICIOS
        # Nota: Usamos 'rewrite' + 'break' para quitar el prefijo
        # y variables para permitir el escalado (replicas > 1).
        # ---------------------------------------------------------

        # 1. AUTH (CORREGIDO)
        location /auth/ {
            set $upstream_auth auth:8080;

            # Elimina el prefijo /auth/ para que solo quede /api/v1/auth/login
            rewrite ^/auth/(.*) /$1 break;

            # Pasa la ruta reescrita al microservicio
            proxy_pass http://$upstream_auth;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 2. CATALOGO
        location /catalogo/ {
            # La variable sigue siendo necesaria para el escalado
            set $upstream_catalogo catalogo:8081;

            # IMPORTANTE: Aquí NO hay rewrite, pero el proxy_pass SÍ lleva la barra final.
            # Esto le dice a Nginx que quite '/auth' y le pase el resto de la URL al backend.
            proxy_pass http://$upstream_catalogo/api/v1/catalogo/; # <- ¡Cambio clave aquí!

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 3. CONTENIDO
        location /contenido/ {
            set $upstream_contenido contenido:8082;
            rewrite ^/contenido/(.*) /$1 break;
            proxy_pass http://$upstream_contenido;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 4. EMAIL
        location /email/ {
            set $upstream_email email:8083;
            rewrite ^/email/(.*) /$1 break;
            proxy_pass http://$upstream_email;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 5. FORO
        location /foro/ {
            set $upstream_foro foro:8085;
            rewrite ^/foro/(.*) /$1 break;
            proxy_pass http://$upstream_foro;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 6. GEO
        location /geo/ {
            set $upstream_geo geo:8086;
            rewrite ^/geo/(.*) /$1 break;
            proxy_pass http://$upstream_geo;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 7. MULTIMEDIA
        location /multimedia/ {
            set $upstream_multimedia multimedia:8089;
            rewrite ^/multimedia/(.*) /$1 break;
            proxy_pass http://$upstream_multimedia;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 8. USUARIO
        location /usuario/ {
            set $upstream_usuario usuario:8093;
            rewrite ^/usuario/(.*) /$1 break;
            proxy_pass http://$upstream_usuario;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 9. VEHICULO
        location /vehiculo/ {
            set $upstream_vehiculo vehiculo:8094;
            rewrite ^/vehiculo/(.*) /$1 break;
            proxy_pass http://$upstream_vehiculo;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---------------------------------------------------------
        # ENDPOINTS DE UTILIDAD
        # ---------------------------------------------------------

        # Health check endpoint (para Docker/K8s/AWS LB)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx metrics (para Prometheus)
        # IMPORTANTE: Solo accesible desde redes privadas/internas
        location /stub_status {
            stub_status;
            allow 127.0.0.1;           # localhost
            allow 10.0.0.0/8;          # RFC1918 private network
            allow 172.16.0.0/12;       # RFC1918 private network
            allow 192.168.0.0/16;      # RFC1918 private network
            deny all;
            access_log off;
        }

        # Default location (evitar exponer info por error)
        location / {
            return 404 "Not Found\n";
            add_header Content-Type text/plain;
        }
    }
}