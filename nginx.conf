events {
    worker_connections 1024;
}

http {
    # Resolver DNS de Docker - CRÍTICO para resolución dinámica
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost;
        default_type application/json;

        # Configuración para archivos estáticos
        location /uploads/ {
            alias /uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
        }

        # Proxy para el servicio de autenticación
        location /auth/ {
            set $upstream_auth auth:8080;
            proxy_pass http://$upstream_auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Proxy para el servicio de catálogo
        location /catalogo/ {
            set $upstream_catalogo catalogo:8081;
            proxy_pass http://$upstream_catalogo/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
