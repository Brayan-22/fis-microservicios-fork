events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    # === Upstreams de microservicios ===
    upstream auth         { server fis-auth:8080; }
    upstream catalogo     { server fis-catalogo:8081; }
    upstream contenido    { server fis-contenido:8082; }
    upstream email        { server fis-email:8083; }
    upstream foro         { server fis-foro:8085; }
    upstream geo          { server fis-geo:8086; }
    upstream multimedia   { server fis-multimedia:8089; }
    upstream usuario      { server fis-usuario:8093; }
    upstream vehiculo     { server fis-vehiculo:8094; }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck para el balanceador Nginx
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /stub_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.18.0.0/16;   # red docker
            deny all;
        }

        # =======================================
        #   CONFIG ESTÁNDAR PARA PROXY
        # =======================================
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # =======================================
        #   RUTAS DE MICROSERVICIOS
        # =======================================

        location /auth/ {
            proxy_pass http://auth/;
        }

        location /catalogo/ {
            proxy_pass http://catalogo/;
        }

        location /contenido/ {
            proxy_pass http://contenido/;
        }

        location /email/ {
            proxy_pass http://email/;
        }

        location /foro/ {
            proxy_pass http://foro/;
        }

        location /geo/ {
            proxy_pass http://geo/;
        }

        location /multimedia/ {
            proxy_pass http://multimedia/;
        }

        location /usuario/ {
            proxy_pass http://usuario/;
        }

        location /vehiculo/ {
            proxy_pass http://vehiculo/;
        }

        # Opción: si quieres servir frontend después, acá lo ubicarás
        # location / {
        #     root /usr/share/nginx/html;
        #     try_files $uri $uri/ /index.html;
        # }
    }
}
