events {
    worker_connections 1024;
}

http {

    upstream auth_backend {
        server fis-auth:8080;
    }

    upstream usuario_backend {
        server usuario:8093;
    }

    upstream email_backend {
        server email:8083;
    }

    upstream vehiculo_backend {
        server vehiculo:8094;
    }

    upstream contenido_backend {
        server contenido:8082;
    }

    upstream foro_backend {
        server foro:8085;
    }

    upstream multimedia_backend {
        server multimedia:8089;
    }

    upstream geo_backend {
        server geo:8086;
    }

    # upstream moderacion_backend {
    #     server moderacion:8088;
    # }

    server {
        listen 80;
        server_name localhost;
        default_type application/json;


        # Configuración para archivos estáticos
        location /uploads/ {
            alias /uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
        }


        # Proxy para el servicio de autenticación
        location /auth/ {
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Proxy para el servicio de usuarios
        location /usuario/ {
            proxy_pass http://usuario_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Proxy para el servicio de email
        location /email/ {
            proxy_pass http://email_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Proxy para el servicio de vehiculo
        location /vehiculo/ {
            proxy_pass http://vehiculo_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        #Proxy para el servicio de multimedia
        location /multimedia/ {
            proxy_pass http://multimedia_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        #Proxy para el servicio de geo
        location /geo/ {
            proxy_pass http://geo_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        #Proxy para el servicio de moderacion
        # location /moderacion/ {
        #     proxy_pass http://moderacion_backend/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
            
        #     proxy_connect_timeout 30s;
        #     proxy_send_timeout 30s;
        #     proxy_read_timeout 30s;
        # }

        #Proxy para el servicio de contenido
        location /contenido/ {
            proxy_pass http://contenido_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        #Proxy para el servicio de foro
        location /foro/ {
            proxy_pass http://foro_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }



        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /stub_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.18.0.0/16;   # red docker
            deny all;
        }

        # Nginx metrics
        location /stub_status {
            stub_status;
            allow all; 
        }

        # Default location
        location / {
            return 404 "Not Found\n";
            add_header Content-Type text/plain;
        }
    }
}